# Render Blueprint — deploys TimeAtlas as a free static web service.
# No environment variables or secrets required. Push to main → auto-deploy.
services:
  - type: web
    name: timeatlas
    runtime: static
    autoDeploy: true
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: 22
    routes:
      # SPA fallback — every route serves the app shell
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
